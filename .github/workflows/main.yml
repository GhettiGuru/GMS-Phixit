name: APK & AAB CI Build
env:
  main_project_module: app
  playstore_name: GMSPhixit

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: echo "DISABLE_ANALYTICS=true" >> $GITHUB_ENV

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Decode google-services.json from secret
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > ${{ env.main_project_module }}/google-services.json

      - name: Setup Gradle Cache (dependencies and wrapper)
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
            gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run gradle wrapper
        run: ./gradlew wrapper

      - name: Setup Android SDK cmdline tools
        run: |
          sudo mkdir -p /usr/local/android-sdk/cmdline-tools
          curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools.zip -d /usr/local/android-sdk/cmdline-tools
          mv /usr/local/android-sdk/cmdline-tools/cmdline-tools /usr/local/android-sdk/cmdline-tools/latest
          yes | /usr/local/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/android-sdk --licenses
          /usr/local/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/android-sdk "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Set Android SDK env variables
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/android-sdk" >> $GITHUB_ENV
          echo "PATH=/usr/local/android-sdk/platform-tools:/usr/local/android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV

      - name: Decode signing keystore file
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ./keystore.jks

      - name: Set signing environment variables
        run: |
          echo "SIGNING_KEY=$(pwd)/keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEYSTORE_PASS=${{ secrets.KEYSTORE_PASS }}" >> $GITHUB_ENV

      - name: Build project
        run: ./gradlew build

      - name: Build APK Debug
        run: ./gradlew assembleDebug

      - name: Build APK Release (analytics disabled)
        run: ./gradlew assembleRelease -PdisableAnalytics=true

      - name: Build AAB Release
        run: ./gradlew ${{ env.main_project_module }}:bundleRelease

      - name: Sign Release APK
        run: |
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore ./keystore.jks \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEYSTORE_PASS }} \
            ${{ env.main_project_module }}/build/outputs/apk/release/app-release-unsigned.apk ${{ secrets.KEY_ALIAS }}

          zipalign -v -p 4 \
            ${{ env.main_project_module }}/build/outputs/apk/release/app-release-unsigned.apk \
            ${{ env.main_project_module }}/build/outputs/apk/release/app-release.apk

      - name: Verify Signed APK
        run: apksigner verify --verbose ${{ env.main_project_module }}/build/outputs/apk/release/app-release.apk

      - name: Sign Release AAB
        run: |
          apksigner sign --ks ./keystore.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEYSTORE_PASS }} \
            ${{ env.main_project_module }}/build/outputs/bundle/release/app-release.aab

      - name: Verify Signed AAB
        run: apksigner verify --verbose ${{ env.main_project_module }}/build/outputs/bundle/release/app-release.aab

      # Upload artifacts
      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }} - ${{ env.playstore_name }} - ${{ env.repository_name }} - APK Debug
          path: ${{ env.main_project_module }}/build/outputs/apk/debug/

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }} - ${{ env.playstore_name }} - ${{ env.repository_name }} - APK Release
          path: ${{ env.main_project_module }}/build/outputs/apk/release/app-release.apk

      - name: Upload AAB Release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }} - ${{ env.playstore_name }} - ${{ env.repository_name }} - AAB Release
          path: ${{ env.main_project_module }}/build/outputs/bundle/release/app-release.aab
